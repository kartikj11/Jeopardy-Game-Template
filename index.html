<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golmaal Hai Bhai Sabh Golmaal Hai | Diwali Jeopardy</title>
    <meta name="description" content="Golmaal Hai Bhai Sabh Golmaal Hai — A festive Diwali-themed Jeopardy game.">
    <meta name="theme-color" content="#14061f">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.youtube.com">
    <link rel="preconnect" href="https://www.youtube-nocookie.com">
    <link rel="preconnect" href="https://i.ytimg.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Rozha+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
    <!-- Ambient festive layers (decorative) -->
    <canvas id="fireworks" class="fx-fireworks" aria-hidden="true"></canvas>
    <div class="fx-sky" aria-hidden="true">
        <div class="fx-lanterns" id="lanterns"></div>
        <div class="fx-embers" id="embers"></div>
    </div>
    <div class="toran" id="toran" aria-hidden="true"></div>

    <main class="container">
        <header class="hero">
            <svg class="rangoli" viewBox="0 0 200 200" aria-hidden="true">
                <defs>
                    <radialGradient id="rgGold" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#ffe7a3"/>
                        <stop offset="100%" stop-color="#ff9e1b"/>
                    </radialGradient>
                </defs>
                <g class="rangoli-outer" fill="none" stroke="url(#rgGold)" stroke-width="1.2">
                    <circle cx="100" cy="100" r="92" stroke-dasharray="2 6"/>
                    <circle cx="100" cy="100" r="84"/>
                </g>
                <g class="rangoli-petals" id="rangoliPetals"></g>
                <g class="rangoli-inner" fill="none" stroke="#ff4f8b" stroke-width="1">
                    <circle cx="100" cy="100" r="34"/>
                    <circle cx="100" cy="100" r="26" stroke="#ffd76a" stroke-dasharray="3 4"/>
                </g>
            </svg>

            <p class="eyebrow">
                <span class="eyebrow-line" aria-hidden="true"></span>
                Shubh Deepavali
                <span class="eyebrow-line" aria-hidden="true"></span>
            </p>

            <div class="title-row">
                <div class="diya diya--left" aria-hidden="true">
                    <div class="diya-flame"><span></span></div>
                    <div class="diya-bowl"></div>
                </div>
                <h1 class="title" data-text="JEOPARDY!">JEOPARDY!</h1>
                <div class="diya diya--right" aria-hidden="true">
                    <div class="diya-flame"><span></span></div>
                    <div class="diya-bowl"></div>
                </div>
            </div>

            <p class="subtitle">Golmaal Hai Bhai Sabh Golmaal Hai &bull; Diwali Edition</p>
        </header>

        <section class="board-frame" aria-label="Game board">
            <span class="frame-corner frame-corner--tl" aria-hidden="true"></span>
            <span class="frame-corner frame-corner--tr" aria-hidden="true"></span>
            <span class="frame-corner frame-corner--bl" aria-hidden="true"></span>
            <span class="frame-corner frame-corner--br" aria-hidden="true"></span>
            <div class="game-board board-intro" id="gameBoard" role="grid">
                <!-- Game board will be generated by JavaScript -->
            </div>
        </section>

        <section class="teams" id="teams" aria-labelledby="teamsTitle">
            <div class="teams-head">
                <h2 class="teams-title" id="teamsTitle">
                    <span class="teams-title-ornament" aria-hidden="true"></span>
                    Teams
                </h2>
                <button type="button" class="btn-ghost btn-ghost--sm" id="addTeamBtn">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
                    Add team
                </button>
            </div>
            <div class="team-list" id="teamList">
                <!-- Team cards are generated by JavaScript -->
            </div>
            <p class="sr-only" id="scoreStatus" role="status" aria-atomic="true"></p>
        </section>

        <footer class="status-bar">
            <div class="progress" aria-live="polite">
                <svg class="progress-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 3c1.6 2.3 2.6 3.9 2.6 5.4A2.6 2.6 0 0 1 12 11a2.6 2.6 0 0 1-2.6-2.6C9.4 6.9 10.4 5.3 12 3Z" fill="#ffc94a"/>
                    <path d="M3 13h18c-.6 4-4.4 7-9 7s-8.4-3-9-7Z" fill="#e2572b"/>
                </svg>
                <span><strong id="litCount">0</strong> / <span id="totalCount">30</span> diyas lit</span>
                <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>
            </div>
            <button type="button" class="btn-ghost" id="resetBtn">Reset board</button>
        </footer>
    </main>

    <dialog class="modal" id="questionModal" aria-labelledby="modalCategory">
        <div class="modal-content">
            <div class="modal-glow" aria-hidden="true"></div>
            <div class="modal-header">
                <h2 id="modalCategory"></h2>
                <div class="modal-header-right">
                    <span class="points" id="modalPoints"></span>
                    <button type="button" class="modal-close-btn" id="modalCloseX" aria-label="Close question">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
                    </button>
                </div>
            </div>
            <div class="modal-body">
                <div id="questionContent">
                    <div id="questionText"></div>
                    <div id="questionMedia" class="media-slot"></div>
                    <div class="hint-container" id="hintContainer" hidden>
                        <button type="button" class="btn-hint" id="toggleHintBtn" aria-expanded="false">
                            <svg class="hint-icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M9 21h6m-3-18a7 7 0 0 0-4.9 12c.7.7 1.1 1.6 1.3 2.5h7.2c.2-.9.6-1.8 1.3-2.5A7 7 0 0 0 12 3Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            <span id="hintBtnText">Show Hint</span>
                        </button>
                        <div class="question-hint" id="questionHint" hidden></div>
                    </div>
                </div>
                <div id="answerContent" hidden>
                    <p class="answer-label">Answer</p>
                    <div id="answerText"></div>
                    <div id="answerMedia" class="media-slot"></div>
                </div>
            </div>
            <div class="award-panel" id="awardPanel" hidden>
                <p class="award-label" id="awardLabel">Award points</p>
                <div class="award-list" id="awardList" role="group" aria-labelledby="awardLabel"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-primary" id="revealAnswerBtn">Reveal Answer</button>
                <button type="button" class="btn-primary" id="closeModalBtn" hidden>Close</button>
            </div>
        </div>
    </dialog>

    <script src="script.js?v=3"></script>
    <script src="media.js?v=3"></script>
    <script src="teams.js?v=3"></script>
    <script src="game.js?v=3"></script>
</body>
</html>
